<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahsan Mashrafi</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #f0f0f0;
            --gold: #d4af37;
        }
       
        * { margin: 0; padding: 0; box-sizing: border-box; }
       
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }
       
        .nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.8rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: 0.4s;
        }
       
        .nav.scrolled {
            background: rgba(10, 10, 10, 0.95);
            padding: 1.2rem 8%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }
       
        .logo {
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: white;
        }
       
        .nav-links a {
            color: var(--text);
            text-decoration: none;
            margin-left: 2.5rem;
            font-weight: 500;
            position: relative;
            transition: 0.3s;
        }
       
        .nav-links a:hover {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 10%;
        }
       
        .hero h1 {
            font-size: 4.8rem;
            margin-bottom: 1rem;
        }
       
        .hero p {
            font-size: 1.5rem;
            color: #bbbbbb;
            max-width: 700px;
            margin: 0 auto;
        }
       
        section {
            padding: 110px 8%;
        }
       
        .section-title {
            font-size: 2.8rem;
            text-align: center;
            margin-bottom: 4rem;
            color: var(--gold);
        }
       
        /* Projects */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 2rem;
        }
       
        .project-card {
            background: #111111;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #222;
            transition: all 0.4s ease;
        }
       
        .project-card:hover {
            transform: translateY(-12px);
            border-color: var(--gold);
            box-shadow: 0 20px 40px rgba(212, 175, 55, 0.1);
        }
       
        .project-card h3 {
            padding: 1.6rem 1.8rem 0.8rem;
            font-size: 1.4rem;
        }
       
        .project-card p {
            padding: 0 1.8rem;
            color: #aaaaaa;
            margin-bottom: 1.5rem;
        }
       
        .project-card .tech {
            padding: 0 1.8rem 1.8rem;
            color: var(--gold);
            font-size: 0.95rem;
        }

        .more-projects {
            text-align: center;
            margin-top: 3rem;
        }
       
        /* Footer / Contact */
        footer {
            background: #050505;
            padding: 80px 8% 50px;
            text-align: center;
        }
       
        .social-links a {
            font-size: 1.8rem;
            margin: 0 18px;
            color: #999;
            transition: 0.3s;
        }
       
        .social-links a:hover {
            color: var(--gold);
            transform: translateY(-4px);
        }
       
        .cta {
            display: inline-block;
            margin-top: 2rem;
            padding: 14px 36px;
            border: 2px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="nav" id="nav">
        <div class="logo">AHSAN MASHRAFI</div>
        <div class="nav-links">
            <a href="#projects">Projects</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
            <a href="#more-projects">More Projects</a>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div style="text-align: center;">
            <div style="margin-bottom: 2.5rem;">
                <img src="favicon.png"
                     alt="Ahsan Mashrafi"
                     style="width: 260px; height: 260px; border-radius: 50%; object-fit: cover; border: 6px solid #d4af37; box-shadow: 0 10px 40px rgba(212, 175, 55, 0.25);">
            </div>
            <h1>Ahsan Mashrafi</h1>
            <p>LLM Specialist | AI Infrastructure & Automation</p>
        </div>
    </section>

    <!-- Featured Projects -->
    <section id="projects">
        <h2 class="section-title">Featured Projects</h2>
        <div class="projects-grid" id="projects-container"></div>
    </section>

    <!-- About -->
    <section id="about">
        <h2 class="section-title">About Me</h2>
        <p style="max-width: 800px; margin: 0 auto; font-size: 1.2rem; text-align: center; color: #cccccc;">
            Placeholder bio. Tell your story here...
        </p>
    </section>

    <!-- Contact -->
    <section id="contact">
        <h2 class="section-title">Let's Connect</h2>
        <div style="text-align: center; margin-top: 2rem;">
            <a href="mailto:ahsan.mashrafi.ai@gmail.com" class="cta">Send me an email</a>
        </div>
    </section>

    <!-- More Projects Section -->
    <section id="more-projects">
        <h2 class="section-title">More Projects</h2>
        <div class="projects-grid" id="more-projects-container"></div>
        
        <div class="more-projects">
            <a href="more-projects.html" class="cta">View All Projects →</a>
        </div>
    </section>

    <footer>
        <div class="social-links">
            <a href="https://github.com/ahsan-mashrafi" target="_blank"><i class="fab fa-github"></i></a>
            <a href="https://huggingface.co/ahsan-mashrafi" target="_blank"><svg style="width: 1em; height: 1em; fill: currentColor; display: inline-block; vertical-align: -0.125em;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm0 22c-5.52 0-10-4.48-10-10S6.48 2 12 2s10 4.48 10 10-4.48 10-10 10zm3-12c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm-6 0c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm3 6c1.66 0 3-1.34 3-3H9c0 1.66 1.34 3 3 3z"/></svg></a>
            <a href="https://x.com/ahsan_ML" target="_blank"><i class="fab fa-x-twitter"></i></a>
            <a href="https://www.linkedin.com/in/ahsan-mashrafi" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://www.youtube.com/@ahsan-mashrafi" target="_blank"><i class="fab fa-youtube"></i></a>
        </div>
        <p style="margin-top: 3rem; opacity: 0.5;">© 2026 Ahsan Mashrafi</p>
    </footer>

    <script>
        // === FEATURED PROJECTS ===
        const featuredProjects = [
            {
                title: "Project Name 1",
                description: "Short description of this project. Replace this text later.",
                tech: "Python • LangChain • LLM • Docker",
                link: "#"
            },
            // Add more featured projects here
        ];

        // === MORE PROJECTS (Easy to add continuously) ===
        const moreProjects = [
            {
                title: "Project Name 5",
                description: "Short description of this additional project.",
                tech: "Python • FastAPI • PostgreSQL",
                link: "#"
            },
            {
                title: "Project Name 6",
                description: "Short description of this additional project.",
                tech: "LangGraph • CrewAI • Redis",
                link: "#"
            },
            // Just copy the block above to add new projects easily ↓
        ];

        // Render Featured Projects
        const featuredContainer = document.getElementById('projects-container');
        featuredProjects.forEach(project => {
            const card = createProjectCard(project);
            featuredContainer.appendChild(card);
        });

        // Render More Projects
        const moreContainer = document.getElementById('more-projects-container');
        moreProjects.forEach(project => {
            const card = createProjectCard(project);
            moreContainer.appendChild(card);
        });

        function createProjectCard(project) {
            const card = document.createElement('a');
            card.href = project.link;
            card.target = "_blank";
            card.style.textDecoration = "none";
            card.style.color = "inherit";
           
            card.innerHTML = `
                <div class="project-card">
                    <h3>${project.title}</h3>
                    <p>${project.description}</p>
                    <div class="tech">${project.tech}</div>
                </div>
            `;
            return card;
        }

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 80);
        });
    </script>
</body>
</html>
